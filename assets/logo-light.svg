<svg xmlns="http://www.w3.org/2000/svg" viewBox="254 342 88 88" width="88" height="88" role="img"
     aria-labelledby="manwe-logo-light-title manwe-logo-light-desc" focusable="false">
  <title id="manwe-logo-light-title">Manwe perception proving ground</title>
  <desc id="manwe-logo-light-desc">A machined sky-scope optic with a mechanical iris and a quadcopter caught in the aperture.</desc>
  <defs>
    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.30"/>
    </filter>
    <filter id="mwBloom" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="mwBarrel" gradientUnits="userSpaceOnUse" cx="298" cy="380" r="40">
      <stop offset="0%" stop-color="#36536d"/><stop offset="60%" stop-color="#1a3045"/><stop offset="100%" stop-color="#0b1521"/>
    </radialGradient>
    <linearGradient id="mwBezel" x1="0" y1="352" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/><stop offset="45%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="mwWell" gradientUnits="userSpaceOnUse" cx="298" cy="382" r="13">
      <stop offset="0%" stop-color="#23465f"/><stop offset="60%" stop-color="#102a43"/><stop offset="100%" stop-color="#06111e"/>
    </radialGradient>
    <radialGradient id="mwCore" gradientUnits="userSpaceOnUse" cx="298" cy="386" r="6">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.76"/><stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.46"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mwDisc"><circle cx="298" cy="386" r="26.5"/></clipPath>
  </defs>
  <style>
    .mw-iris      { fill: #14283a; stroke: #0369a1; stroke-opacity: 0.46; stroke-width: 1; }
    .mw-well      { fill: url(#mwWell); }
    .mw-core      { fill: url(#mwCore); }
    .mw-aphex     { fill: none; stroke: #e0f2fe; stroke-opacity: 0.52; stroke-width: 0.8; stroke-linejoin: round; }
    .mw-blade     { fill: none; stroke: #38bdf8; stroke-opacity: 0.76; stroke-width: 1.2; }
    .mw-blade-sh  { fill: none; stroke: #020617; stroke-opacity: 0.68; stroke-width: 1.2; }
    .mw-inner     { fill: none; stroke: url(#mwBezel); stroke-width: 1.6; stroke-opacity: 0.9; stroke-linecap: round; }
    .mw-notch     { fill: none; stroke: #e0f2fe; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
    .mw-tick      { stroke: #0ea5e9; stroke-opacity: 0.62; stroke-width: 1; }
    .mw-dot       { fill: #bae6fd; fill-opacity: 0.24; }
    .mw-lock      { fill: none; stroke: #ef4444; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .mw-lock-dot  { fill: #ff6b5e; }
    .mw-lock-g    { fill: none; stroke: #4ade80; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .mw-lock-g-dot{ fill: #86efac; }
    .mw-lock-y    { fill: none; stroke: #facc15; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .mw-lock-y-dot{ fill: #fde047; }
    .mw-lock-o    { fill: none; stroke: #fb923c; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .mw-lock-o-dot{ fill: #fdba74; }
    .mw-drone-arm { fill: none; stroke: #38bdf8; stroke-width: 1.4; stroke-linecap: round; }
    .mw-rotor     { fill: #18364d; stroke: #38bdf8; stroke-width: 1.2; }
    .mw-hub       { fill: #f0f9ff; }
    .mw-ring      { fill: none; stroke: url(#mwBezel); stroke-width: 2.2; }
    .mw-groove    { fill: none; stroke: #020617; stroke-opacity: 0.50; stroke-width: 1; }
    .mw-hairline  { fill: none; stroke: #075985; stroke-opacity: 0.68; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>
