<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1900" role="img" aria-labelledby="title description">
  <title id="title">Manwe architecture, portrait layout</title>
  <desc id="description">The NumPy reference path produces local measurements, tracks, and tracking metrics. The independent optional model path produces candidates and export receipts. Separate interface inspection and a compatible artifact are required for a schema-2 package. The shared Candle runtime implements batch and viewer execution, but a real artifact and golden forward remain unqualified. No Manwe downstream adapter is implemented. Solid arrows mean local data flow. Dashed arrows mean a separately required handoff.</desc>
  <defs>
    <linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#0c1d2e"/><stop offset="1" stop-color="#101b27"/></linearGradient>
    <linearGradient id="card" x2=".8" y2="1"><stop stop-color="#182e40"/><stop offset="1" stop-color="#142536"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9dcf2" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#7bd5ed" stroke-width="1.5"/></marker>
    <marker id="required" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#ecc186" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eff7fc}
      .kicker{font-size:16px;font-weight:650;letter-spacing:1.2px;fill:#8acddd}
      .title{font-size:32px;font-weight:650;letter-spacing:-.6px}.heading{font-size:25px;font-weight:600}
      .body{font-size:21px;fill:#d0dfe9}.small{font-size:19px;fill:#b8cddc}.warn{fill:#ecc186}
      .box{fill:url(#card);stroke:#3c586d;stroke-width:1.2}.flow{fill:none;stroke:#7bd5ed;stroke-width:2;marker-end:url(#arrow)}
      .need{fill:none;stroke:#ecc186;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#required)}
    </style>
  </defs>
  <rect width="480" height="1900" rx="20" fill="url(#paper)"/><rect width="480" height="1900" rx="20" fill="url(#grid)"/>
  <g id="header">
    <text x="28" y="43" class="kicker">MANWE / PERCEPTION RESEARCH</text>
    <text x="28" y="88" class="title">Perception tools</text>
    <text x="28" y="128" class="title">Model interfaces</text>
    <text x="28" y="167" class="small">Two independent research paths</text>
    <path d="M28 190H452" stroke="#3c586d"/>
  </g>
  <g id="numerical-reference">
    <text x="28" y="226" class="kicker">01 / NUMPY REFERENCE PATH</text>
    <text x="28" y="258" class="small">No model weights or hosted service</text>
    <rect x="28" y="284" width="424" height="148" rx="14" class="box"/>
    <text x="50" y="322" class="heading">Numerical tools</text>
    <text x="50" y="358" class="body">Audio · camera geometry</text>
    <text x="50" y="391" class="body">Tracking · synthetic scenarios</text>
    <path d="M240 439V466" class="flow"/>
    <rect x="28" y="476" width="424" height="150" rx="14" class="box"/>
    <text x="50" y="514" class="heading">Reference outputs</text>
    <text x="50" y="551" class="body">Measurements and tracks</text>
    <text x="50" y="588" class="small">Local objects; no wire protocol</text>
    <path d="M240 633V660" class="flow"/>
    <rect x="28" y="670" width="424" height="150" rx="14" class="box"/>
    <text x="50" y="708" class="heading">Evaluate the reference</text>
    <text x="50" y="745" class="body">OSPA / GOSPA tracking error</text>
    <text x="50" y="782" class="small">Synthetic evidence stays synthetic</text>
    <text x="28" y="856" class="small">Direction is not range. Real-camera</text>
    <text x="28" y="883" class="small">calibration uncertainty remains gated.</text>
  </g>
  <g id="model-workflow">
    <path d="M28 914H452" stroke="#3c586d"/>
    <text x="28" y="952" class="kicker">02 / OPTIONAL MODEL PATH</text>
    <rect x="28" y="978" width="424" height="181" rx="14" class="box"/>
    <text x="50" y="1016" class="heading">Train and export</text>
    <text x="50" y="1053" class="body">Private dataset → trainer</text>
    <text x="50" y="1086" class="body">Checkpoint → raw conversion</text>
    <text x="50" y="1129" class="small warn">Candidate + export receipt</text>
    <path d="M69 1166V1200" class="need"/>
    <text x="91" y="1188" class="small warn">Separate handoff required</text>
    <rect x="28" y="1214" width="424" height="188" rx="14" class="box"/>
    <text x="50" y="1252" class="heading">Assemble the interface</text>
    <text x="50" y="1289" class="body">Artifact + schema-2 contract</text>
    <text x="50" y="1322" class="small">Separate backend inspection</text>
    <text x="50" y="1368" class="small warn">No automatic Candle conversion</text>
    <path d="M240 1409V1436" class="flow"/>
    <rect x="28" y="1446" width="424" height="192" rx="14" class="box"/>
    <text x="50" y="1484" class="heading">Shared Candle runtime</text>
    <text x="50" y="1521" class="body">Batch JSON + annotations</text>
    <text x="50" y="1554" class="body">Experimental camera viewer</text>
    <text x="50" y="1592" class="small warn">Real artifact + golden forward:</text>
    <text x="50" y="1619" class="small warn">qualification still required</text>
  </g>
  <g id="downstream-boundary">
    <rect x="28" y="1670" width="424" height="128" rx="14" fill="#18222d" stroke="#a48a6c" stroke-dasharray="4 5"/>
    <text x="50" y="1706" class="heading">Downstream composition</text>
    <text x="50" y="1740" class="small warn">No Manwe adapter implemented</text>
    <text x="50" y="1772" class="small">Consumer fixtures remain required</text>
  </g>
  <g id="legend">
    <path d="M29 1833H67" class="flow"/><text x="83" y="1840" class="small">Local data flow</text>
    <path d="M29 1867H67" class="need"/><text x="83" y="1874" class="small">Required separate handoff</text>
  </g>
</svg>
