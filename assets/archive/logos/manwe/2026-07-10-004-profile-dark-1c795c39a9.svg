<svg xmlns="http://www.w3.org/2000/svg" viewBox="236 324 124 124" width="124" height="124" role="img" aria-label="MANWE historical profile mark"><title>MANWE historical profile mark</title><desc>Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</desc><defs><filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    </defs><style>:root{--hub-accent: #34d399; --cube-accent: #fb923c; --tri-accent: #a78bfa;}
.radar{color: #38bdf8;}
.radar-seat{fill: #38bdf8; fill-opacity: 0.08; filter: url(#soft);}
.radar-ring{fill: none; stroke: #38bdf8; stroke-opacity: 0.4; stroke-width: 1;}
.radar-line{fill: none; stroke: #7dd3fc; stroke-width: 1.4; stroke-linecap: round; opacity: 0.95;}
.radar-blip{fill: #7dd3fc;}
.radar-wing{fill: none; stroke: #7dd3fc; stroke-linecap: round;}</style><g class="nodes"><g class="radar">
    <defs>
      <radialGradient id="radarBeam" gradientUnits="userSpaceOnUse" cx="298" cy="386" r="30">
        <stop offset="0%" stop-color="currentColor" stop-opacity="0.34" />
        <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
      </radialGradient>
    </defs>
    <circle cx="298" cy="386" r="34" class="radar-seat" />
    <circle cx="298" cy="386" r="11" class="radar-ring" />
    <circle cx="298" cy="386" r="21" class="radar-ring" />
    <circle cx="298" cy="386" r="30" class="radar-ring" />
    <line x1="268" y1="386" x2="328" y2="386" class="radar-ring" />
    <line x1="298" y1="356" x2="298" y2="416" class="radar-ring" />
    <g class="radar-sweep">
      <path d="M298 386 L328 386 A30 30 0 0 1 318.8 407.6 Z" class="radar-beam" fill="url(#radarBeam)" />
      <line x1="298" y1="386" x2="328" y2="386" class="radar-line" />
      <animateTransform attributeName="transform" type="rotate" from="0 298 386" to="360 298 386" dur="5s" repeatCount="indefinite" />
    </g>
    <path d="M276.4 396.8 Q292.6 391.4 313.1 374.1" class="radar-wing" stroke-width="2.2" stroke-opacity="0.95" />
