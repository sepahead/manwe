<svg xmlns="http://www.w3.org/2000/svg" viewBox="236 324 124 124" width="124" height="124" role="img" aria-label="MANWE historical profile mark"><title>MANWE historical profile mark</title><desc>Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</desc><defs><filter id="mwBloom" x="-300%" y="-300%" width="700%" height="700%">
