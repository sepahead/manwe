version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Routine version updates are applied as reviewed maintenance batches.
    # Security-update PRs are exempt from this limit. Keep that repository feature enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /metal-yolo-tests
    schedule:
      interval: weekly
    # Routine version updates are applied as reviewed maintenance batches.
    # Security-update PRs are exempt from this limit. Keep that repository feature enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    # Routine version updates are applied as reviewed maintenance batches.
    # Security-update PRs are exempt from this limit. Keep that repository feature enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Routine version updates are applied as reviewed maintenance batches.
    # Security-update PRs are exempt from this limit. Keep that repository feature enabled.
    open-pull-requests-limit: 0
